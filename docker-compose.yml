services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile

        container_name: esign-app

        volumes:
            - .:/var/www

        working_dir: /var/www

        depends_on:
            - postgres
            - redis

    nginx:
        image: nginx:latest

        container_name: esign-nginx

        ports:
            - "8000:80"

        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

        depends_on:
            - app

    postgres:
        image: postgres:17

        container_name: esign-postgres

        environment:
            POSTGRES_DB: esign
            POSTGRES_USER: esign
            POSTGRES_PASSWORD: secret

        ports:
            - "5432:5432"

    redis:
        image: redis:latest

        container_name: esign-redis

        ports:
            - "6379:6379"
