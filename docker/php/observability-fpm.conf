[www]
; Docker provides these to the PHP-FPM master. Forward only the observability
; settings needed by Laravel workers, which otherwise clear their environment.
env[OBSERVABILITY_ENABLED] = $OBSERVABILITY_ENABLED
env[OTEL_SERVICE_NAME] = $OTEL_SERVICE_NAME
env[OBSERVABILITY_CONSOLE_SERVICE_NAME] = $OBSERVABILITY_CONSOLE_SERVICE_NAME
env[OTEL_SERVICE_VERSION] = $OTEL_SERVICE_VERSION
env[OTEL_EXPORTER_OTLP_ENDPOINT] = $OTEL_EXPORTER_OTLP_ENDPOINT
env[OTEL_EXPORTER_OTLP_PROTOCOL] = $OTEL_EXPORTER_OTLP_PROTOCOL
env[OTEL_TRACES_SAMPLER_ARG] = $OTEL_TRACES_SAMPLER_ARG
env[OBSERVABILITY_EXPORT_TIMEOUT_MS] = $OBSERVABILITY_EXPORT_TIMEOUT_MS
