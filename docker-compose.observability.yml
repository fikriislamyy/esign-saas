services:
  app:
    environment:
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-esign-api}
      OBSERVABILITY_CONSOLE_SERVICE_NAME: ${OBSERVABILITY_CONSOLE_SERVICE_NAME:-esign-scheduler}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OBSERVABILITY_EXPORT_TIMEOUT_MS: ${OBSERVABILITY_EXPORT_TIMEOUT_MS:-200}
    networks: [default, observability]

  scheduler:
    environment:
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-esign-api}
      OBSERVABILITY_CONSOLE_SERVICE_NAME: ${OBSERVABILITY_CONSOLE_SERVICE_NAME:-esign-scheduler}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OBSERVABILITY_EXPORT_TIMEOUT_MS: ${OBSERVABILITY_EXPORT_TIMEOUT_MS:-200}
    networks: [default, observability]

networks:
  observability:
    name: esign-observability
    external: true
